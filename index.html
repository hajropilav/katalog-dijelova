<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretraga dijelova</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, Arial, sans-serif;
        background: #f4f6f7;
        color: #1a2e35;
    }
    .header {
        background: #123e34;
        color: white;
        padding: 22px 16px;
        text-align: center;
    }
    .header h1 { margin: 0 0 4px 0; font-size: 22px; }
    .header p { margin: 0; opacity: 0.85; font-size: 13px; }

    .sadrzaj { max-width: 700px; margin: 0 auto; padding: 16px; }

    .pretraga-wrap { position: relative; margin-bottom: 16px; }
    .pretraga-wrap span {
        position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
        font-size: 16px; color: #8a9199;
    }
    #pretraga {
        width: 100%;
        padding: 14px 14px 14px 40px;
        font-size: 16px;
        border: 2px solid #1a7a3f;
        border-radius: 10px;
        outline: none;
    }

    .rezultat {
        background: white;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .rezultat-info { flex: 1; min-width: 180px; }
    .rezultat-naziv { font-weight: 600; font-size: 15px; }
    .rezultat-meta { font-size: 12.5px; color: #8a9199; margin-top: 3px; }
    .rezultat-cijena { font-weight: 700; font-size: 16px; color: #123e34; white-space: nowrap; }
    .rezultat-stanje { font-size: 12px; margin-top: 3px; }
    .stanje-ima { color: #1a7a3f; font-weight: 600; }

    .btn-narudzba {
        background: #7360f2;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn-narudzba:active { background: #5f4dd6; }

    .prazno { text-align: center; color: #8a9199; padding: 40px 20px; font-size: 14px; }

    .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #123e34;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13.5px;
        display: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        max-width: 90%;
        text-align: center;
    }

    .izbor-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 100;
        align-items: center;
        justify-content: center;
    }
    .izbor-overlay.aktivan { display: flex; }
    .izbor-box {
        background: white;
        border-radius: 14px;
        padding: 22px 20px;
        width: 280px;
        max-width: 90%;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .izbor-naslov {
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 16px;
        color: #1a2e35;
    }
    .izbor-btn {
        display: block;
        width: 100%;
        padding: 13px;
        margin-bottom: 10px;
        border: none;
        border-radius: 10px;
        font-size: 14.5px;
        font-weight: 600;
        color: white;
        cursor: pointer;
    }
    .izbor-btn--viber { background: #7360f2; }
    .izbor-btn--viber:active { background: #5f4dd6; }
    .izbor-btn--whatsapp { background: #25d366; }
    .izbor-btn--whatsapp:active { background: #1eb958; }
    .izbor-otkazi {
        background: none;
        border: none;
        color: #8a9199;
        font-size: 13px;
        cursor: pointer;
        padding: 6px;
    }
</style>
</head>
<body>

<div class="header">
    <h1>🔧 Pretraga dijelova</h1>
    <p>Provjeri imamo li dio koji ti treba</p>
    <p id="viber-info" style="display:none; margin-top:8px; font-size:12.5px;">💬 Narudžbe: <strong id="viber-broj-prikaz"></strong></p>
</div>

<div id="izbor-overlay" class="izbor-overlay" onclick="if(event.target===this) zatvoriIzbor();">
    <div class="izbor-box">
        <div class="izbor-naslov">Kako želiš poslati narudžbu?</div>
        <button class="izbor-btn izbor-btn--viber" onclick="posaljiViber()">📞 Viber</button>
        <button class="izbor-btn izbor-btn--whatsapp" onclick="posaljiWhatsApp()">💬 WhatsApp</button>
        <button class="izbor-otkazi" onclick="zatvoriIzbor()">Otkaži</button>
    </div>
</div>

<div class="sadrzaj">
    <div class="pretraga-wrap">
        <span>🔍</span>
        <input type="text" id="pretraga" placeholder="Ukucaj naziv ili kataloški broj dijela..." autofocus>
    </div>

    <div id="rezultati"></div>
    <div id="prazno" class="prazno">Ukucaj naziv dijela da vidiš da li ga imamo na stanju.</div>
</div>

<div class="toast" id="toast"></div>

<script>
let katalog = [];
let viberBroj = "";

fetch("katalog.json")
    .then(r => r.json())
    .then(data => {
        katalog = data.artikli || [];
        viberBroj = data.viber_broj || "";
        if (viberBroj) {
            document.getElementById("viber-broj-prikaz").textContent = formatViberBrojRano(viberBroj);
            document.getElementById("viber-info").style.display = "block";
        }
    })
    .catch(() => {
        document.getElementById("prazno").textContent = "Katalog trenutno nije dostupan. Pokušaj kasnije.";
    });

function formatViberBrojRano(broj) {
    const cisto = (broj || "").replace(/[^0-9]/g, "");
    if (!cisto) return "";
    if (cisto.length >= 9) {
        return "+" + cisto.slice(0, 3) + " " + cisto.slice(3, 5) + " " + cisto.slice(5, 8) + " " + cisto.slice(8);
    }
    return "+" + cisto;
}

function formatBroj(b) {
    return b.toFixed(2).replace(".", ",");
}

function prikaziToast(tekst) {
    const toast = document.getElementById("toast");
    toast.textContent = tekst;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 6000);
}

let cekaTekst = "";
let cekaBroj = "";

function naruci(naziv, kataloski, cijena) {
    cekaTekst = `Zdravo, zanima me dio: ${naziv}${kataloski ? " (šifra: " + kataloski + ")" : ""} — cijena ${formatBroj(cijena)} KM. Da li je dostupan?`;
    cekaBroj = viberBroj.replace(/[^0-9]/g, "");
    document.getElementById("izbor-overlay").classList.add("aktivan");
}

function zatvoriIzbor() {
    document.getElementById("izbor-overlay").classList.remove("aktivan");
}

function posaljiWhatsApp() {
    zatvoriIzbor();
    const url = `https://wa.me/${cekaBroj}?text=${encodeURIComponent(cekaTekst)}`;
    window.open(url, "_blank");
}

function posaljiViber() {
    zatvoriIzbor();
    const brojPrikaz = formatViberBrojRano(viberBroj);

    if (navigator.clipboard) {
        navigator.clipboard.writeText(cekaTekst).then(() => {
            prikaziToast(`📋 Poruka kopirana! Otvara se Viber — pronađi razgovor sa brojem ${brojPrikaz} i zalijepi poruku (long press → Paste), pa pošalji.`);
        }).catch(() => {
            prikaziToast(`Otvaram Viber — pošalji na broj ${brojPrikaz}: ${cekaTekst}`);
        });
    } else {
        prikaziToast(`Otvaram Viber — pošalji na broj ${brojPrikaz}: ${cekaTekst}`);
    }

    setTimeout(() => {
        window.location.href = `viber://chat?number=%2B${cekaBroj}`;
    }, 600);
}

function prikaziRezultate(lista) {
    const rezultati = document.getElementById("rezultati");
    const prazno = document.getElementById("prazno");

    if (!lista.length) {
        rezultati.innerHTML = "";
        prazno.style.display = "block";
        prazno.textContent = "Nema dijelova koji odgovaraju pretrazi.";
        return;
    }

    prazno.style.display = "none";

    rezultati.innerHTML = lista.slice(0, 100).map(d => `
        <div class="rezultat">
            <div class="rezultat-info">
                <div class="rezultat-naziv">${d.naziv}</div>
                <div class="rezultat-meta">${d.kataloski_broj ? "Šifra: " + d.kataloski_broj : ""}</div>
                <div class="rezultat-stanje stanje-ima">✓ Na stanju${d.kolicina ? " (" + d.kolicina + " kom)" : ""}</div>
            </div>
            <div style="text-align:right;">
                <div class="rezultat-cijena">${formatBroj(d.cijena)} KM</div>
                <button class="btn-narudzba" onclick="naruci('${d.naziv.replace(/'/g, "\\'")}', '${(d.kataloski_broj||'').replace(/'/g, "\\'")}', ${d.cijena})">💬 Naruči</button>
            </div>
        </div>
    `).join("");
}

function normalizuj(tekst) {
    return (tekst || "").toString().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

document.getElementById("pretraga").addEventListener("input", function() {
    const upit = normalizuj(this.value.trim());
    if (upit.length < 2) {
        document.getElementById("rezultati").innerHTML = "";
        document.getElementById("prazno").style.display = "block";
        document.getElementById("prazno").textContent = "Ukucaj naziv dijela da vidiš da li ga imamo na stanju.";
        return;
    }
    const filtrirano = katalog.filter(d =>
        normalizuj(d.naziv).includes(upit) || normalizuj(d.kataloski_broj).includes(upit)
    );
    prikaziRezultate(filtrirano);
});
</script>

</body>
</html>
